<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 96" fill="none">
  <!-- Geometric CA Monogram -->
  <g transform="translate(4, 8)">
    <!-- 'C' Arc / Precision Curve in Consult America Burgundy -->
    <path
      d="M48 8 C25.9 8 8 25.9 8 48 C8 70.1 25.9 88 48 88 C62 88 74.5 80.8 81.8 69.8 L67.5 59.5 C63.2 66 56.1 70.5 48 70.5 C35.6 70.5 25.5 60.4 25.5 48 C25.5 35.6 35.6 25.5 48 25.5 C56.1 25.5 63.2 30 67.5 36.5 L81.8 26.2 C74.5 15.2 62 8 48 8 Z"
      fill="#B63A3A"
    />
    
    <!-- 'A' Precision Triangle & Cross-Architecture in Deep Charcoal/Gold Accented Structure -->
    <!-- Upward A Wing (Right Leg) -->
    <path
      d="M48 16 L88 88 L70.5 88 L48 46 L37.5 66.5 L25 58 L48 16 Z"
      fill="#102033"
    />
    
    <!-- Inner Precision Pyramid Core -->
    <polygon
      points="48,46 59.5,69 36.5,69"
      fill="#B63A3A"
    />
    
    <!-- Dynamic Forward Swoosh Beam -->
    <path
      d="M14 62 C32 50 64 42 94 48 C76 54 44 60 14 62 Z"
      fill="#357C78"
    />
  </g>

  <!-- Vertical Divider Rule -->
  <line x1="112" y1="20" x2="112" y2="76" stroke="#D7CCBD" stroke-width="1.5" stroke-linecap="round" />

  <!-- Modern Enterprise Grotesk Wordmark -->
  <g transform="translate(128, 0)">
    <!-- CONSULT -->
    <text
      x="0"
      y="44"
      font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', sans-serif"
      font-size="27"
      font-weight="700"
      letter-spacing="0.04em"
      fill="#102033"
    >CONSULT</text>
    
    <!-- AMERICA -->
    <text
      x="126"
      y="44"
      font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', sans-serif"
      font-size="27"
      font-weight="800"
      letter-spacing="0.04em"
      fill="#B63A3A"
    >AMERICA</text>

    <!-- Subtitle / Practice Credential Strip -->
    <text
      x="1"
      y="66"
      font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', sans-serif"
      font-size="8.5"
      font-weight="600"
      letter-spacing="0.22em"
      fill="#695F57"
    >STRATEGY  ·  TECHNOLOGY  ·  RESULTS</text>
  </g>
</svg>
