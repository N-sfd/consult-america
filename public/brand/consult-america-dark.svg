    />
  </g>

  <!-- Vertical Divider Rule -->
  <line x1="104" y1="20" x2="104" y2="72" stroke="#D7CCBD" stroke-width="1.75" stroke-linecap="round" />

  <!-- Clean Horizontal Wordmark: CONSULT AMERICA in Solid Deep Navy #102033 -->
  <g transform="translate(122, 0)">
    <!-- CONSULT (Semi-bold 600) in Solid Deep Navy #102033 -->
    <text
      x="0"
      y="54"
      font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
      font-size="33"
      font-weight="600"
      letter-spacing="0.04em"
      fill="#102033"
    >CONSULT</text>

    <!-- AMERICA (Medium 500) in Solid Deep Navy #102033 -->
    <text
      x="154"
      y="54"
      font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
      font-size="33"
      font-weight="500"
